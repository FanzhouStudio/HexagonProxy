name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7 and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip" -OutFile godot.zip
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -OutFile templates.zip
          Expand-Archive godot.zip -DestinationPath .godot-bin
          Expand-Archive templates.zip -DestinationPath .godot-templates
          $target = Join-Path $env:APPDATA "Godot\export_templates\4.7.stable"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item ".godot-templates\templates\*" $target -Recurse -Force

      - name: Download Mihomo core
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^mihomo-windows-amd64-v3-.*\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "Windows x64 Mihomo release asset not found" }
          Invoke-WebRequest $asset.browser_download_url -OutFile mihomo.zip
          Expand-Archive mihomo.zip -DestinationPath .mihomo
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $core = Get-ChildItem .mihomo -File -Filter "*.exe" | Select-Object -First 1
          if (-not $core) { throw "Mihomo executable not found in release archive" }
          Copy-Item $core.FullName "bin\mihomo.exe" -Force

      - name: Test
        shell: pwsh
        run: |
          & ".godot-bin\Godot_v4.7-stable_win64.exe" --headless --path . --script res://tests/test_runner.gd

      - name: Export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & ".godot-bin\Godot_v4.7-stable_win64.exe" --headless --path . --export-release "Windows Desktop" "build\六角代理.exe"

      - name: Package release files
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP "hexagon_proxy_iexpress"
          $payload = Join-Path $packageRoot "payload"
          $temporaryInstaller = Join-Path $packageRoot "HexagonProxySetup.exe"
          New-Item -ItemType Directory -Force -Path dist, $payload | Out-Null
          Copy-Item "build\六角代理.exe" "dist\六角代理.exe" -Force
          Copy-Item "build\六角代理.exe" (Join-Path $payload "HexagonProxy.exe") -Force
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, installer\install.ps1, installer\uninstall.ps1 $payload -Force
          Copy-Item "third_party\Mihomo-LICENSE.txt" $payload -Force
          $source = $payload.TrimEnd("\") + "\"
          $sed = Get-Content "installer\package.sed" -Raw
          $sed = $sed.Replace("__TARGET_PATH__", $temporaryInstaller).Replace("__SOURCE_PATH__", $source)
          $generatedSed = Join-Path $packageRoot "package.generated.sed"
          Set-Content $generatedSed $sed -Encoding Default
          & "$env:SystemRoot\System32\iexpress.exe" /N $generatedSed
          $deadline = [DateTime]::UtcNow.AddMinutes(3)
          $lastLength = -1
          $stableChecks = 0
          while ([DateTime]::UtcNow -lt $deadline -and $stableChecks -lt 3) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path $temporaryInstaller)) { continue }
            $currentLength = (Get-Item $temporaryInstaller).Length
            if ($currentLength -gt 0 -and $currentLength -eq $lastLength) { $stableChecks++ } else { $stableChecks = 0; $lastLength = $currentLength }
          }
          if (-not (Test-Path $temporaryInstaller) -or $stableChecks -lt 3) { throw "Installer package was not created" }
          Move-Item $temporaryInstaller "dist\六角代理安装包.exe" -Force
          Get-ChildItem "dist\*.exe" | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash + " *" + (Split-Path $_.Path -Leaf) } | Set-Content "dist\SHA256SUMS.txt" -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: hexagon-proxy-windows-x64
          path: |
            dist/六角代理.exe
            dist/六角代理安装包.exe
            dist/SHA256SUMS.txt
