name: Build Windows C++
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build offline Linux resources
        shell: pwsh
        run: node tools/build_linux_runtime.mjs
      - name: Test and package C++ client
        shell: pwsh
        run: ./tools/build_windows_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HexagonProxy-windows-x64
          path: |
            dist/HexagonProxy.exe
            dist/SHA256SUMS.txt
