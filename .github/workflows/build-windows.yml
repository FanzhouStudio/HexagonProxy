name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7 and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_win64.exe.zip" -OutFile godot.zip
          Invoke-WebRequest "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz" -OutFile templates.zip
          Expand-Archive godot.zip -DestinationPath .godot-bin
          Expand-Archive templates.zip -DestinationPath .godot-templates
          $target = Join-Path $env:APPDATA "Godot\export_templates\4.7.stable"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item ".godot-templates\templates\*" $target -Recurse -Force

      - name: Test and package
        shell: pwsh
        run: |
          & ./tools/build_windows_release.ps1 -GodotPath (Join-Path $PWD '.godot-bin/Godot_v4.7-stable_win64_console.exe')

      - uses: actions/upload-artifact@v4
        with:
          name: hexagon-proxy-windows-x64
          path: |
            dist/HexagonProxy.exe
            dist/SHA256SUMS.txt
